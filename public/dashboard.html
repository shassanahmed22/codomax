<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Inkwell</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <header class="masthead">
        <div class="wrap masthead-inner">
            <a href="index.html" class="brand">Inkwell<span style="color:var(--accent-2)">.</span></a>
            <nav class="primary-nav">
                <a href="index.html">Home</a>
                <a href="dashboard.html" class="active">
                    <span class="ink-mark">Dashboard
                        <svg viewBox="0 0 90 10" preserveAspectRatio="none">
                            <path d="M2 6 Q 22 2, 45 6 T 88 5" />
                        </svg>
                    </span>
                </a>
                <a href="create-blog.html">Write</a>
            </nav>
            <div id="nav-auth-slot"></div>
        </div>
    </header>

    <main>
        <div class="wrap">
            <p class="eyebrow">Your desk</p>
            <h1 id="greeting">Welcome back.</h1>
            <p class="lede" style="margin-bottom:36px;">Everything you've written, in one place — published and still in
                draft.</p>

            <div class="stat-row">
                <div class="stat-card">
                    <div class="num" id="stat-total">0</div>
                    <div class="label">Total posts</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-published">0</div>
                    <div class="label">Published</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-drafts">0</div>
                    <div class="label">Drafts</div>
                </div>
            </div>

            <div class="section-head">
                <h2>Your posts</h2>
                <a href="create-blog.html" class="btn btn-primary">+ New post</a>
            </div>

            <div class="table-list" id="post-table"></div>
        </div>
    </main>

    <footer class="site-foot">
        <div class="wrap" style="display:flex; justify-content:space-between; width:100%;">
            <span>Inkwell — a Module 2 frontend build</span>
            <span>Home · Login · Register · Dashboard · Write</span>
        </div>
    </footer>

    <script src="assets/app.js"></script>
    <script>
        requireAuth();
        const user = Auth.currentUser();

        async function render() {
            if (!user) return;
            document.getElementById('greeting').textContent = `Welcome back, ${user.name.split(' ')[0]}.`;

            const mine = await Posts.mine();
            document.getElementById('stat-total').textContent = mine.length;
            document.getElementById('stat-published').textContent = mine.filter(p => p.status === 'published').length;
            document.getElementById('stat-drafts').textContent = mine.filter(p => p.status === 'draft').length;

            const table = document.getElementById('post-table');

            if (mine.length === 0) {
                table.innerHTML = `
        <div class="empty-state">
          <h3>No posts yet</h3>
          <p>Your first post is one click away.</p>
          <br>
          <a href="create-blog.html" class="btn btn-primary">Write your first post</a>
        </div>`;
                return;
            }

            table.innerHTML = mine.map(p => `
      <div class="table-row" data-id="${p.id}">
        <div>
          <div class="title">${escapeHTML(p.title)}</div>
          <div class="date">${escapeHTML(p.tag || 'general')}</div>
        </div>
        <div class="date">${formatDate(p.createdAt)}</div>
        <div><span class="status">${p.status === 'published' ? 'Published' : 'Draft'}</span></div>
        <div class="row-actions">
          <button data-action="edit">Edit</button>
          <button data-action="delete" class="danger">Delete</button>
        </div>
      </div>
    `).join('');

            table.querySelectorAll('button[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.closest('.table-row').dataset.id;
                    window.location.href = `create-blog.html?id=${id}`;
                });
            });
            table.querySelectorAll('button[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.closest('.table-row').dataset.id;
                    if (confirm('Delete this post? This can\'t be undone.')) {
                        await Posts.remove(id);
                        render();
                    }
                });
            });
        }

        render();
    </script>
</body>

</html>
